# rsomeip-proto cargo manifest.
# More info: <https://doc.rust-lang.org/cargo/reference/manifest.html>

[package]
name = "rsomeip-proto"
version = "0.1.0"
description = "Sans-IO implementation of the SOME/IP protocol."
documentation = "https://docs.rs/rsomeip-proto"
readme = "README.md"
keywords = ["someip", "sans-io"]

# Inherited from workspace.
authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Used for serialization of data types according to the SOME/IP on-wire format.
rsomeip-bytes.workspace = true
# Used to specify error types in library code.
thiserror.workspace = true

[features]
# Implementation of the SOME/IP Transport Protocol (TP) extension.
tp = []

[lints]
# Inherited from workspace.
workspace = true
