# rsomeip-bytes cargo manifest.
# More info: <https://doc.rust-lang.org/cargo/reference/manifest.html>

[package]
name = "rsomeip-bytes"
version = "0.2.0"
description = "Serialization crate for the SOME/IP on-wire format."
documentation = "https://docs.rs/rsomeip-bytes"
readme = "README.md"
keywords = ["someip", "bytes", "serialization"]

# Inherited from workspace.
authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Used to generalize writing and reading byte buffers.
bytes = { workspace = true }
# Used to specify error types in library code.
thiserror = { workspace = true }

[dev-dependencies]
# Micro benchmarking harness.
criterion = { workspace = true, features = ["html_reports"] }

[features]
# Features enabled by default.
default = ["std"]
# Adds support for `std` types.
std = ["bytes/std", "thiserror/std"]

[lints]
# Inherited from workspace.
workspace = true

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "deserialize"
harness = false
